services:
  - type: web
    name: kern
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm run serve
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: MAX_AUDITS_PER_HOUR
        value: "3"
      - key: MAX_AUDITS_PER_DAY
        value: "20"
